<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jadwal & PR</title>
    <style>
        /* Menggunakan font standar WhatsApp */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        h2 { margin-top: 0; font-size: 1.3rem; color: #ffffff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 0.95rem; color: #b3b3b3; }
        
        /* Input & Textarea */
        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.95rem;
            resize: vertical;
        }
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #777;
        }

        /* Buttons (Desain Netral/Bersih) */
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border-radius: 8px;
            border: none;
            background-color: #e0e0e0;
            color: #121212;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        button:hover { background-color: #ffffff; }
        .btn-outline {
            background-color: transparent;
            border: 1px solid #e0e0e0;
            color: #e0e0e0;
        }
        .btn-outline:hover { background-color: #333; color: #fff; }
        .btn-danger { background-color: #ff5252; color: #fff; border: none; }
        .btn-danger:hover { background-color: #ff7676; }

        /* Custom Dropdown UI */
        .custom-select-wrapper {
            position: relative;
            user-select: none;
            margin-top: 8px;
        }
        .custom-select {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .custom-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            margin-top: 5px;
            z-index: 10;
            display: none;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .custom-options.show { display: block; }
        .custom-option {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #333;
        }
        .custom-option:last-child { border-bottom: none; }
        .custom-option:hover { background-color: #444; }

        /* Checkbox Info Templates */
        .info-checkbox-group {
            margin-top: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #444;
        }
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #ccc;
        }
        .checkbox-container:last-child { margin-bottom: 0; }
        .checkbox-container input {
            margin-right: 10px;
            margin-top: 3px;
            cursor: pointer;
        }

        /* Area Hasil */
        .copy-area {
            background-color: #1a1a1a;
            border: 1px solid #555;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
        }
        .copy-area h3 { margin: 0 0 10px 0; color: #fff; font-size: 1.1rem; text-align: center; }
        textarea#hasilJadwal {
            height: 450px;
            font-family: monospace; /* Tetap monospace agar susunan template rapi saat di copy */
            white-space: pre;
            background-color: #121212;
            border: none;
            color: #d4d4d4;
        }

        /* Custom Modal / Popup UI */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            background-color: #222;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            transform: translateY(-20px);
            transition: transform 0.2s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-title { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 10px; }
        .modal-desc { font-size: 0.95rem; color: #ccc; margin-bottom: 20px; line-height: 1.5; }
        .modal-btn { background-color: #e0e0e0; color: #121212; width: auto; padding: 10px 30px; margin-top: 0; }
    </style>
</head>
<body>

    <!-- Container Pencatatan PR -->
    <div class="container">
        <h2>📝 Catat PR Hari Ini</h2>
        <label>Pilih Mata Pelajaran:</label>
        
        <!-- Custom Dropdown UI -->
        <div class="custom-select-wrapper" id="dropdownPR">
            <div class="custom-select" onclick="toggleDropdown()">
                <span id="selectedMapel">B. Indonesia</span>
                <span>▼</span>
            </div>
            <div class="custom-options" id="optionsPR">
                <div class="custom-option" onclick="selectOption('PAI')">PAI</div>
                <div class="custom-option" onclick="selectOption('IPS')">IPS</div>
                <div class="custom-option" onclick="selectOption('B. Inggris')">B. Inggris</div>
                <div class="custom-option" onclick="selectOption('B. Indonesia')">B. Indonesia</div>
                <div class="custom-option" onclick="selectOption('Pendidikan Pancasila')">Pendidikan Pancasila</div>
                <div class="custom-option" onclick="selectOption('SBK')">SBK</div>
                <div class="custom-option" onclick="selectOption('IPA')">IPA</div>
                <div class="custom-option" onclick="selectOption('Matematika')">Matematika</div>
                <div class="custom-option" onclick="selectOption('B. Sunda')">B. Sunda</div>
                <div class="custom-option" onclick="selectOption('BTQ')">BTQ</div>
                <div class="custom-option" onclick="selectOption('PJOK')">PJOK</div>
                <div class="custom-option" onclick="selectOption('Informatika')">Informatika</div>
            </div>
        </div>

        <label for="isiPR">Detail PR/Tugas:</label>
        <textarea id="isiPR" rows="3" placeholder="Contoh: selesaikan modul halaman 7..."></textarea>
        <button onclick="simpanPR()">Simpan PR</button>
    </div>

    <!-- Container Generate Jadwal -->
    <div class="container">
        <h2>⚙️ Persiapan Jadwal Besok</h2>
        
        <label>Template Info Cepat (Pilih bisa >1):</label>
        <div class="info-checkbox-group">
            <label class="checkbox-container">
                <input type="checkbox" value="Besok upacara! datang lebih awal.">
                Info 1 (Upacara)
            </label>
            <label class="checkbox-container">
                <input type="checkbox" value="Besok kokurikuler Tasaqur di lapangan! datang lebih awal, membawa perlengkapan sholat, dan infak seikhlasnya.">
                Info 2 (Tasaqur)
            </label>
            <label class="checkbox-container">
                <input type="checkbox" value="Mengingatkan kembali bahwa pelajaran SBK memerlukan penggaris.">
                Info 3 (SBK Penggaris)
            </label>
            <label class="checkbox-container">
                <input type="checkbox" value="Besok kokurikuler senam di lapangan! datang lebih awal.">
                Info 4 (Senam)
            </label>
        </div>

        <label for="infoBesok">Info Tambahan Manual (Opsional):</label>
        <textarea id="infoBesok" rows="2" placeholder="Tulis info manual di sini jika ada..."></textarea>
        
        <button onclick="generateJadwal()">Buat Jadwal Besok</button>
        <button onclick="hapusSemuaPR()" class="btn-danger">Hapus Semua Data PR</button>
        
        <div class="copy-area">
            <h3>📋 Halaman Hasil Jadwal</h3>
            <textarea id="hasilJadwal" readonly placeholder="Klik 'Buat Jadwal Besok' terlebih dahulu..."></textarea>
            <button onclick="copyKeClipboard()">Copy Jadwal ke Clipboard</button>
        </div>
    </div>

    <!-- Container Sync Data (Cross Device) -->
    <div class="container">
        <h2>🔄 Sinkronisasi Data (Cross Device)</h2>
        <label>Salin kode ini dan Paste di device lain untuk memindahkan data PR.</label>
        <input type="text" id="syncKode" readonly placeholder="Kode Data PR Kosong">
        <button onclick="copySyncKode()" class="btn-outline">Copy Kode Data</button>
        
        <label>Paste kode dari device lain ke sini:</label>
        <input type="text" id="inputSyncKode" placeholder="Paste kode di sini...">
        <button onclick="importSyncKode()" class="btn-outline">Impor Data</button>
    </div>

    <!-- Custom Modal / Popup -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Notifikasi</div>
            <div class="modal-desc" id="modalDesc">Pesan ini adalah notifikasi.</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        /* MENGATUR UI CUSTOM DROPDOWN */
        const dropdownOptions = document.getElementById('optionsPR');
        const selectedMapelText = document.getElementById('selectedMapel');
        let currentSelectedMapel = "B. Indonesia"; // Default

        function toggleDropdown() {
            dropdownOptions.classList.toggle('show');
        }

        function selectOption(value) {
            currentSelectedMapel = value;
            selectedMapelText.innerText = value;
            dropdownOptions.classList.remove('show');
        }

        // Tutup dropdown jika klik di luar
        window.onclick = function(event) {
            if (!event.target.closest('.custom-select-wrapper')) {
                dropdownOptions.classList.remove('show');
            }
        }

        /* MENGATUR CUSTOM MODAL (POPUP ALERT) */
        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('customModal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        /* DATABASE JADWAL & ALIAS (Singkatan PR) */
        const jadwalSekolah = {
            1: { hari: "Senin", waktu: "06.30 – 11.50", seragam: "Putih Biru", mapel: ["PAI", "PAI", "PAI", "IPS", "```Istirahat```", "IPS", "B. Inggris", "B. Inggris"] },
            2: { hari: "Selasa", waktu: "06.30 – 11.50", seragam: "Putih Biru", mapel: ["B. Indonesia", "B. Indonesia", "Pendidikan Pancasila", "```Istirahat```", "Pendidikan Pancasila", "SBK", "SBK"] },
            3: { hari: "Rabu", waktu: "06.30 – 11.50", seragam: "Kebaya / Encim", mapel: ["IPA", "IPA", "IPA", "```Istirahat```", "Matematika", "Matematika", "Matematika"] },
            4: { hari: "Kamis", waktu: "06.30 – 12.10", seragam: "Batik", mapel: ["B. Sunda", "BTQ", "PJOK", "```Istirahat```", "PJOK", "IPA", "Informatika", "Informatika"] },
            5: { hari: "Jumat", waktu: "06.30 – 11.25", seragam: "Muslim", mapel: ["Matematika", "IPS", "B. Inggris", "```Istirahat```", "B. Indonesia", "B. Indonesia", "B. Indonesia"] }
        };

        const aliasPR = {
            "Pendidikan Pancasila": "PP",
            "B. Indonesia": "B. Indo",
            "Matematika": "MTK"
        };

        /* FUNGSI PENYIMPANAN PR */
        function simpanPR() {
            const isi = document.getElementById('isiPR').value.trim();
            if (!isi) {
                showModal("Gagal Menyimpan", "Isi detail tugas PR tidak boleh kosong!");
                return;
            }
            
            let dataPR = JSON.parse(localStorage.getItem('dataPR')) || {};
            dataPR[currentSelectedMapel] = isi;
            localStorage.setItem('dataPR', JSON.stringify(dataPR));
            
            updateSyncCode();
            showModal("Berhasil!", "PR untuk " + currentSelectedMapel + " berhasil dicatat.");
            document.getElementById('isiPR').value = ""; 
        }

        function hapusSemuaPR() {
            if(confirm("Yakin ingin menghapus semua data PR minggu ini?")) {
                localStorage.removeItem('dataPR');
                updateSyncCode();
                showModal("Berhasil", "Semua data PR telah dibersihkan.");
            }
        }

        /* FUNGSI SINKRONISASI (CROSS-DEVICE) */
        function updateSyncCode() {
            const dataStr = localStorage.getItem('dataPR');
            document.getElementById('syncKode').value = dataStr ? btoa(encodeURIComponent(dataStr)) : "";
        }
        
        function copySyncKode() {
            const input = document.getElementById('syncKode');
            if(!input.value) {
                showModal("Kosong", "Tidak ada data untuk disalin.");
                return;
            }
            input.select();
            document.execCommand('copy');
            showModal("Disalin!", "Kode sinkronisasi berhasil disalin. Paste kode ini di device lainmu.");
        }

        function importSyncKode() {
            const kode = document.getElementById('inputSyncKode').value.trim();
            if(!kode) {
                showModal("Gagal Impor", "Kode tidak valid atau kosong.");
                return;
            }
            try {
                const decodedData = decodeURIComponent(atob(kode));
                localStorage.setItem('dataPR', decodedData);
                updateSyncCode();
                document.getElementById('inputSyncKode').value = "";
                showModal("Berhasil!", "Data PR dari device lain berhasil diimpor.");
            } catch (e) {
                showModal("Error", "Kode yang dimasukkan salah atau korup.");
            }
        }

        // Jalankan saat web dibuka
        updateSyncCode();

        /* FUNGSI FORMAT TULISAN BATAS BINTANG ✰ */
        function wrapText(prefix, text) {
            const maxLen = 27; // Batas aman sebelum tembus bintang
            let fullText = prefix + text;
            const words = fullText.split(' ');
            let lines = [];
            let currentLine = '';

            for (let word of words) {
                if (currentLine.length + word.length + (currentLine.length > 0 ? 1 : 0) > maxLen) {
                    if (currentLine) lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = currentLine ? currentLine + ' ' + word : word;
                }
            }
            if (currentLine) lines.push(currentLine);

            let result = '';
            for (let i = 0; i < lines.length; i++) {
                if (i === 0) {
                    result += `│ • ${lines[i]}\n`;
                } else {
                    result += `│    ${lines[i]}\n`;
                }
            }
            return result.trimRight(); 
        }

        /* FUNGSI UTAMA MEMBUAT TEMPLATE JADWAL */
        function generateJadwal() {
            const dataPR = JSON.parse(localStorage.getItem('dataPR')) || {};
            
            // Mengambil Info dari Checkbox Template
            let listInfo = [];
            document.querySelectorAll('.info-checkbox-group input:checked').forEach((checkbox) => {
                listInfo.push(checkbox.value);
            });
            
            // Mengambil Info Manual
            const manualInfo = document.getElementById('infoBesok').value.trim();
            if(manualInfo) {
                listInfo.push(manualInfo);
            }

            let besok = new Date();
            besok.setDate(besok.getDate() + 1);
            let hariIndex = besok.getDay(); 
            
            if (hariIndex === 0 || hariIndex === 6) {
                showModal("Besok Libur", "Hari Sabtu/Minggu tidak ada jadwal pelajaran.");
                return;
            }

            // Nama bulan bahasa Indonesia
            const bulanIndo = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const formatTanggal = `${besok.getDate()} ${bulanIndo[besok.getMonth()]} ${besok.getFullYear()}`;
            
            const dataJadwal = jadwalSekolah[hariIndex];
            
            /* PEMBUATAN HEADER */
            let teks = `╭─────────────── ✰\n`;
            teks += `│ 🗓️ ${dataJadwal.hari}, ${formatTanggal}\n`;
            teks += `│ ⏰ ${dataJadwal.waktu}\n`;
            teks += `│ 👔 ${dataJadwal.seragam}\n`;
            teks += `├─────────────── ✰\n`;
            teks += `│ 📚 *Jadwal*:\n`;
            
            let mapelUnik = new Set();
            dataJadwal.mapel.forEach(m => {
                teks += `│ • ${m}\n`;
                if(m !== "```Istirahat```") mapelUnik.add(m);
            });
            
            /* PEMBUATAN PR DENGAN SINGKATAN */
            teks += `├─────────────── ✰\n`;
            teks += `│ 📘 *PR*:\n`;
            let adaPR = false;
            
            mapelUnik.forEach(m => {
                if (dataPR[m]) {
                    adaPR = true;
                    // Terapkan Singkatan jika ada di daftar alias, jika tidak pakai nama asli
                    let namaPelajaran = aliasPR[m] || m; 
                    teks += wrapText(namaPelajaran + " ", dataPR[m]) + "\n";
                }
            });
            if (!adaPR) teks += `│ • –\n`;

            /* PEMBUATAN INFO MULTIPEL */
            teks += `├─────────────── ✰\n`;
            teks += `│ 💭 *Info*:\n`;
            if (listInfo.length > 0) {
                listInfo.forEach(infoStr => {
                    teks += wrapText("", infoStr) + "\n";
                });
            } else {
                teks += `│ • –\n`;
            }
            teks += `╰─────────────── ✰`;

            document.getElementById('hasilJadwal').value = teks;
            showModal("Jadwal Siap!", "Jadwal untuk besok berhasil digenerate, gulir ke bawah untuk melihat hasilnya.");
        }

        /* FUNGSI SALIN HASIL */
        function copyKeClipboard() {
            const hasil = document.getElementById('hasilJadwal');
            if(!hasil.value) {
                showModal("Gagal", "Buat jadwal terlebih dahulu sebelum di copy!");
                return;
            }
            hasil.select();
            document.execCommand('copy');
            showModal("Disalin!", "Teks jadwal berhasil disalin dan siap dikirim ke WhatsApp.");
        }
    </script>
</body>
</html>
