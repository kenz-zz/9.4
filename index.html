        // Fungsi menyimpan PR ke penyimpanan lokal browser
        function simpanPR() {
            const mapel = document.getElementById('mapelPR').value;
            const isi = document.getElementById('isiPR').value.trim();
            
            if (!isi) {
                alert("Isi PR tidak boleh kosong!");
                return;
            }
            
            let dataPR = JSON.parse(localStorage.getItem('dataPR')) || {};
            dataPR[mapel] = isi; // Simpan atau timpa PR untuk mapel tersebut
            localStorage.setItem('dataPR', JSON.stringify(dataPR));
            
            alert("PR untuk " + mapel + " berhasil disimpan ke sistem!");
            document.getElementById('isiPR').value = ""; // Kosongkan kolom input
        }

        // Fungsi menghapus semua PR yang sudah selesai/lewat
        function hapusSemuaPR() {
            if(confirm("Yakin ingin menghapus semua data PR yang tersimpan? Lakukan ini jika semua PR minggu ini sudah selesai.")) {
                localStorage.removeItem('dataPR');
                alert("Semua data PR berhasil dibersihkan.");
            }
        }

        // Fungsi memotong teks secara otomatis agar tidak tembus batas ✰ (Maks 28 karakter)
        function wrapText(prefix, text) {
            const maxLen = 28;
            let fullText = prefix + text;
            const words = fullText.split(' ');
            let lines = [];
            let currentLine = '';

            for (let word of words) {
                if (currentLine.length + word.length + (currentLine.length > 0 ? 1 : 0) > maxLen) {
                    if (currentLine) lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = currentLine ? currentLine + ' ' + word : word;
                }
            }
            if (currentLine) lines.push(currentLine);

            let result = '';
            for (let i = 0; i < lines.length; i++) {
                if (i === 0) {
                    result += `│ • ${lines[i]}\n`; // Baris pertama pakai titik
                } else {
                    result += `│    ${lines[i]}\n`; // Baris selanjutnya menjorok
                }
            }
            return result.trimRight(); 
        }
