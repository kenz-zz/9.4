<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Jadwal & PR</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #313244;
            padding: 20px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; font-size: 1.2rem; color: #89b4fa; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        select, input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #45475a;
            background-color: #181825;
            color: #cdd6f4;
            box-sizing: border-box;
        }
        button {
            background-color: #89b4fa;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            border: none;
            transition: 0.2s;
        }
        button:hover { background-color: #b4befe; }
        .btn-danger { background-color: #f38ba8; }
        .btn-danger:hover { background-color: #eba0ac; }
        textarea#hasilJadwal {
            height: 350px;
            font-family: monospace;
            white-space: pre;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📝 Catat PR Hari Ini</h2>
        <label for="mapelPR">Mata Pelajaran:</label>
        <select id="mapelPR">
            <option value="PAI">PAI</option>
            <option value="IPS">IPS</option>
            <option value="B. Inggris">B. Inggris</option>
            <option value="Matematika">Matematika</option>
            <option value="IPA">IPA</option>
            <option value="Bahasa Indonesia">Bahasa Indonesia</option>
        </select>
        <label for="isiPR">Detail PR/Tugas:</label>
        <textarea id="isiPR" rows="3" placeholder="Contoh: selesaikan modul halaman 7..."></textarea>
        <button onclick="simpanPR()">Simpan PR</button>
    </div>

    <div class="container">
        <h2>⚙️ Generate Jadwal Besok</h2>
        <label for="infoBesok">Info Tambahan (Opsional):</label>
        <input type="text" id="infoBesok" placeholder="Contoh: Besok upacara! datang lebih awal.">
        <button onclick="generateJadwal()">Buat Jadwal</button>
        <button onclick="hapusSemuaPR()" class="btn-danger">Hapus Semua Data PR</button>
        
        <label for="hasilJadwal">Hasil Template:</label>
        <textarea id="hasilJadwal" readonly></textarea>
        <button onclick="copyKeClipboard()">Copy Hasil</button>
    </div>

    <script>
        // Database Jadwal (Bisa kamu edit sesuai jadwal aslimu)
        const jadwalSekolah = {
            1: { hari: "Senin", waktu: "06.30 – 11.50", seragam: "Putih Biru", mapel: ["PAI", "PAI", "IPS", "```Istirahat```", "IPS", "B. Inggris", "B. Inggris"] },
            2: { hari: "Selasa", waktu: "06.30 – 11.50", seragam: "Putih Biru", mapel: ["Matematika", "Matematika", "IPA", "```Istirahat```", "Bahasa Indonesia", "Bahasa Indonesia"] },
            3: { hari: "Rabu", waktu: "06.30 – 11.50", seragam: "Pramuka", mapel: ["IPA", "IPA", "B. Inggris", "```Istirahat```", "IPS", "PAI"] },
            4: { hari: "Kamis", waktu: "06.30 – 11.50", seragam: "Batik", mapel: ["Bahasa Indonesia", "Matematika", "Matematika", "```Istirahat```", "IPS", "IPA"] },
            5: { hari: "Jumat", waktu: "06.30 – 11.00", seragam: "Olahraga", mapel: ["PJOK", "PJOK", "```Istirahat```", "PAI", "Bahasa Indonesia"] }
        };

        // Fungsi menyimpan PR ke LocalStorage Browser
        function simpanPR() {
            const mapel = document.getElementById('mapelPR').value;
            const isi = document.getElementById('isiPR').value.trim();
            if (!isi) {
                alert("Isi PR tidak boleh kosong!");
                return;
            }
            let dataPR = JSON.parse(localStorage.getItem('dataPR')) || {};
            dataPR[mapel] = isi;
            localStorage.setItem('dataPR', JSON.stringify(dataPR));
            alert("PR " + mapel + " berhasil disimpan!");
            document.getElementById('isiPR').value = "";
        }

        function hapusSemuaPR() {
            if(confirm("Yakin ingin menghapus semua data PR yang tersimpan?")) {
                localStorage.removeItem('dataPR');
                alert("Data PR dibersihkan.");
            }
        }

        // Fungsi pemotong teks agar tidak tembus batas ✰ (Maks 28 karakter per baris isi)
        function wrapText(prefix, text) {
            const maxLen = 28;
            const words = text.split(' ');
            let lines = [];
            let currentLine = '';

            for (let word of words) {
                if ((currentLine + word).length > maxLen) {
                    lines.push(currentLine.trim());
                    currentLine = word + ' ';
                } else {
                    currentLine += word + ' ';
                }
            }
            if (currentLine) lines.push(currentLine.trim());

            let result = '';
            for (let i = 0; i < lines.length; i++) {
                if (i === 0) {
                    result += `│ • ${prefix}${lines[i]}\n`;
                } else {
                    result += `│    ${lines[i]}\n`;
                }
            }
            return result.trimRight(); 
        }

        function generateJadwal() {
            const info = document.getElementById('infoBesok').value.trim();
            const dataPR = JSON.parse(localStorage.getItem('dataPR')) || {};
            
            // Dapatkan tanggal besok
            let besok = new Date();
            besok.setDate(besok.getDate() + 1);
            let hariIndex = besok.getDay(); // 0 = Minggu, 1 = Senin, dst
            
            if (hariIndex === 0 || hariIndex === 6) {
                document.getElementById('hasilJadwal').value = "Besok libur, tidak ada jadwal sekolah!";
                return;
            }

            const formatTanggal = besok.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const dataJadwal = jadwalSekolah[hariIndex];
            
            // Format Bagian Header & Jadwal
            let teks = `╭─────────────── ✰\n`;
            teks += `│ 🗓️ ${dataJadwal.hari}, ${formatTanggal}\n`;
            teks += `│ ⏰ ${dataJadwal.waktu}\n`;
            teks += `│ 👔 ${dataJadwal.seragam}\n`;
            teks += `├─────────────── ✰\n`;
            teks += `│ 📚 *Jadwal*:\n`;
            
            let mapelUnik = new Set();
            dataJadwal.mapel.forEach(m => {
                teks += `│ • ${m}\n`;
                if(m !== "```Istirahat```") mapelUnik.add(m);
            });
            
            // Format Bagian PR (Otomatis deteksi dari mapel besok)
            teks += `├─────────────── ✰\n`;
            teks += `│ 📘 *PR*:\n`;
            let adaPR = false;
            mapelUnik.forEach(m => {
                if (dataPR[m]) {
                    adaPR = true;
                    // Format: B. Inggris selesaikan modul...
                    teks += wrapText(m + " ", dataPR[m]) + "\n";
                }
            });
            if (!adaPR) teks += `│ • –\n`;

            // Format Bagian Info
            teks += `├─────────────── ✰\n`;
            teks += `│ 💭 *Info*:\n`;
            if (info) {
                teks += wrapText("", info) + "\n";
            } else {
                teks += `│ • –\n`;
            }
            teks += `╰─────────────── ✰`;

            document.getElementById('hasilJadwal').value = teks;
        }

        function copyKeClipboard() {
            const hasil = document.getElementById('hasilJadwal');
            hasil.select();
            document.execCommand('copy');
            alert("Berhasil disalin!");
        }
    </script>
</body>
</html>
